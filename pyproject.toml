[project]
name = "crypto-trading-system"
version = "0.1.0"
description = "Sistema de trading automatizado de criptomonedas con análisis de X (Twitter)"
requires-python = ">=3.11"
dependencies = [
    # Django core
    "django>=5.0,<6.0",
    "djangorestframework>=3.14",
    "django-environ>=0.11",
    "django-cors-headers>=4.3",

    # Database
    "psycopg2-binary>=2.9",

    # Celery & async tasks
    "celery>=5.3",
    "redis>=5.0",
    "django-celery-beat>=2.5",
    "django-celery-results>=2.5",

    # Web3 & Blockchain
    "web3>=6.15",
    "eth-account>=0.11",
    "uniswap-python>=0.7",

    # API clients
    "httpx>=0.26",
    "tweepy>=4.14",  # X/Twitter API

    # Data processing
    "pandas>=2.2",
    "numpy>=1.26",

    # NLP & Text analysis
    "openai>=1.12",  # Para análisis de sentimiento
    "transformers>=4.37",  # HuggingFace models
    "torch>=2.2",
    "scikit-learn>=1.4",

    # Monitoring & observability
    "sentry-sdk>=1.40",
    "prometheus-client>=0.19",

    # Utils
    "python-dateutil>=2.8",
    "pytz>=2024.1",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "black>=24.2",
    "ruff>=0.2",
    "mypy>=1.8",
    "ipython>=8.21",
    "django-debug-toolbar>=4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # defaults
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "migrations",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]
